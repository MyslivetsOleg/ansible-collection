---
# ------------------------------------------------------------
# Установка
# ------------------------------------------------------------
# Путь к .rpm относительно директории роли
cntlm_rpm_src: "files/cntlm.rpm"

# ------------------------------------------------------------
# Аутентификация
# ------------------------------------------------------------
cntlm_username: ""       # обязательно
cntlm_domain: ""         # обязательно
# NTLMv2-хэш: cntlm -H -u <user> -d <DOMAIN>
# Храните в Ansible Vault
cntlm_ntlm_hash: ""      # обязательно

# ------------------------------------------------------------
# Upstream-прокси
# ------------------------------------------------------------
cntlm_proxy_list:
  - "proxy.example.com:8080"

# ------------------------------------------------------------
# Локальный сервер
# ------------------------------------------------------------
cntlm_listen_address: "127.0.0.1"
cntlm_listen_port: 3128
cntlm_conf_path: "/etc/cntlm.conf"

# ------------------------------------------------------------
# Systemd
# ------------------------------------------------------------
cntlm_service_name: "cntlm"
cntlm_service_enabled: true
cntlm_service_state: "started"
cntlm_service_user: "cntlm"
cntlm_service_group: "cntlm"
cntlm_bin_path: "/usr/sbin/cntlm"

# ------------------------------------------------------------
# Проверка работоспособности
# ------------------------------------------------------------
cntlm_run_check: true
cntlm_check_url: "http://example.com"
cntlm_wait_timeout: 15

# ------------------------------------------------------------
# Дополнительные параметры cntlm.conf
# ------------------------------------------------------------
cntlm_timeout: 3000        # таймаут соединения (мс)
cntlm_max_keepalive: 500   # макс. keep-alive соединений
cntlm_dns_ttl: 0           # кэш DNS, 0 = отключён
