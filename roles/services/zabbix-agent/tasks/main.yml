    - name: Ensure wget is installed
      apt:
        name: wget
        state: present

    - name: Download and install Zabbix repository package
      get_url:
        url: "https://repo.zabbix.com/zabbix/{{ zabbix_agent_version }}/debian/pool/main/z/zabbix-release/zabbix-release_{{ zabbix_agent_version }}-1+debian12_all.deb"
        dest: /tmp/zabbix-release.deb
        mode: '0644'

    - name: Install Zabbix repository package
      apt:
        deb: /tmp/zabbix-release.deb

    - name: Update apt cache after adding repo
      apt:
        update_cache: yes

    - name: Install Zabbix Agent 2
      apt:
        name: zabbix-agent2
        state: present

    - name: Check if zabbix_agent2.conf exists
      stat:
        path: /etc/zabbix/zabbix_agent2.conf
      register: conf_file

    - name: Create backup of original config (if exists)
      copy:
        src: /etc/zabbix/zabbix_agent2.conf
        dest: /etc/zabbix/zabbix_agent2.conf.bak
        remote_src: yes
      when: conf_file.stat.exists

    - name: Copy Zabbix Agent 2 configuration template
      template:
        src: templates/zabbix_agent2.conf.j2
        dest: /etc/zabbix/zabbix_agent2.conf
        owner: root
        group: root
        mode: '0644'

    - name: Ensure Zabbix Agent 2 service is enabled and started
      systemd:
        name: zabbix-agent2
        enabled: yes
        state: started

    - name: Clean up downloaded .deb file
      file:
        path: /tmp/zabbix-release.deb
        state: absent

    - name: Restart Zabbix Agent
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted
        enabled: yes